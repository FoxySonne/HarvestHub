<section id="state-map-workspace" class="sm sm-workspace" aria-label="Карта штата">
 <h1 class="sm-sr-only">Карта штата</h1>
 <div id="sm-viewport" class="sm-viewport" data-no-swipe tabindex="0" aria-label="Карта штата. На телефоне масштаб меняется двумя пальцами; на компьютере колёсиком. Перемещение — перетаскиванием."><svg id="sm-svg" viewBox="48 48 928 928" aria-label="Карта владений"><g id="sm-cells"></g><g id="sm-labels" aria-hidden="true"></g></svg><div id="sm-tooltip" hidden role="tooltip"></div></div>
 <header class="sm-brand sm-float"><button type="button" id="sm-menu-toggle" aria-label="Открыть меню" aria-expanded="false" aria-controls="sidebar">☰</button><strong>HarvestHub</strong><button type="button" id="sm-account" aria-label="Открыть профиль"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></button><button type="button" id="sm-toggle-tools" aria-label="Свернуть панель карты" aria-expanded="true" aria-controls="sm-controls">‹</button></header>
 <button type="button" id="sm-map-actions-toggle" class="sm-float" aria-expanded="false" aria-controls="sm-map-actions">Инструменты карты</button><div id="sm-map-actions" class="sm-map-actions sm-float" hidden><button type="button" data-panel="alliances">Союзы</button><button type="button" data-panel="planning">План захватов</button><button type="button" data-panel="summary">Ресурсы и бонусы</button><button type="button" data-panel="settings">Карта и доступ</button></div>
 <aside id="sm-controls" class="sm-controls sm-float" aria-label="Панель карты">
  <label class="sm-search-label"><span class="sm-sr-only">Найти участок</span><input type="search" id="sm-search" placeholder="Найти участок" list="sm-locations" autocomplete="off"><datalist id="sm-locations"></datalist></label>
  <nav class="sm-categories" aria-label="Типы участков"><button type="button" data-category="all" aria-pressed="true">Все<span data-count="all"></span></button><button type="button" data-category="bastion" aria-pressed="false">Бастионы<span data-count="bastion"></span></button><button type="button" data-category="territory" aria-pressed="false">Территории<span data-count="territory"></span></button><button type="button" data-category="trade" aria-pressed="false">Посты<span data-count="trade"></span></button></nav>
  <div class="sm-sidebar-section"><div class="sm-sidebar-heading"><h2>Союзы</h2><button type="button" data-panel="alliances" aria-label="Управлять союзами">＋</button></div><div id="sm-legend" class="sm-legend"></div></div>
  <div class="sm-sidebar-actions"><button type="button" data-panel="planning">▦ План захватов</button><button type="button" data-panel="summary">◇ Ресурсы и бонусы</button><button type="button" data-panel="settings">⚙ Карта и доступ</button></div>
 </aside>
 <select id="sm-filter" hidden aria-label="Типы участков"><option value="all">Вся карта</option><option value="bastion">Бастионы</option><option value="territory">Территории</option><option value="trade">Торговые посты</option></select>
 <div class="sm-view-switch sm-float" role="group" aria-label="Ракурс карты"><button type="button" data-map-view="top" aria-pressed="true">Вид сверху</button><button type="button" data-map-view="game" aria-pressed="false">Как в игре</button></div>
 <div class="sm-zoom-controls sm-float" role="group" aria-label="Масштаб карты"><button type="button" data-zoom="in" aria-label="Приблизить">＋</button><button type="button" data-zoom="out" aria-label="Отдалить">−</button><button type="button" data-zoom="reset" aria-label="Вся карта">⤢</button></div>
 <div class="sm-status sm-float"><span id="sm-save-status" role="status">Загрузка…</span><span id="sm-mode-label"></span><button id="sm-retry-cloud" type="button" hidden>Повторить загрузку</button></div>
 <div id="sm-message" class="sm-notification sm-float" role="status" aria-live="polite"></div>
 <div id="sm-settings-stash" hidden><section id="sm-settings-content" hidden><label>Название карты<input id="sm-title" maxlength="80"></label><button id="sm-save" type="button">Сохранить в аккаунт</button><section class="sm-access"><h2>Доступ к карте</h2><p>Приглашённые видят последнюю сохранённую карту и не могут её менять.</p><form id="sm-invite-form"><label>Ввести пригласительный код<input id="sm-invite" inputmode="numeric" pattern="[0-9]{12}" minlength="12" maxlength="12" autocomplete="off" required></label><button type="submit">Вход</button></form><div class="sm-access-actions"><button type="button" id="sm-own-map" hidden>Вернуться к своей карте</button><button type="button" id="sm-give-code">Выдать пригласительный код</button><button type="button" id="sm-rotate-code" hidden>Сменить код</button><output id="sm-code"></output></div><label id="sm-connections-label" hidden>Карты с сохранённым доступом<select id="sm-connections"><option value="">Выберите карту</option></select></label></section></section></div>
 <dialog id="sm-panel" data-no-swipe class="sm-dialog"><header><button type="button" id="sm-sheet-toggle" aria-label="Свернуть карточку участка" aria-expanded="true" hidden>⌄</button><h2 id="sm-panel-heading"></h2><button id="sm-panel-close" type="button" aria-label="Закрыть панель">×</button></header><div id="sm-panel-content"></div></dialog>
</section>
